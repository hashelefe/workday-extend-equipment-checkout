# Importing catalog items from CSV
ImportItems=Import Items from CSV
ImportIntro=<p>Upload a CSV file to add many assets at once. Every item is placed at your primary work location and becomes available to borrow immediately.</p><p>The first row is a header and is skipped. Each following row needs five columns, in this order: <b>assetTag, itemName, category, serialNumber, notes</b>. serialNumber and notes may be empty, but keep their commas.</p><p>Example row: <code>LT-1042,ThinkPad T14,Laptop,PF3XK2,Spare charger in bag</code></p>
CsvFile=CSV File
ImportResult=Import Result
ItemsCreated=Items Created
NoFailedRows=<p>Every row was imported.</p>
FailedRows=Rows Not Imported
CsvRow=CSV Row
ImportError=Error
BackToManage=Back to Manage Equipment
AssetTagFormat=Use the format LAP-0042 - two to four capital letters, a hyphen, then three to five digits.

